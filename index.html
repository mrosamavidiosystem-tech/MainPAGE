function write(data) {
    DB.ref("/").set(data).catch(console.error);
}
function read(callback) {
    DB.ref("/").once("value").then(snapshot => {
        data=snapshot.val()
        callback(data);
    })
    .catch(console.error);
}
function realTimeRead( path, callback) {
    DB.ref(path).on("value", snapshot => {
        callback(snapshot.val());
    });
}
function stopRealTimeRead( path) {
    DB.ref(path).off();
}

function Jee_Encription(text){
    res="A"
    for (const car of text){
        res+=String(car.codePointAt(0))+"_"
    }
    console.log()
    return res.slice(0,res.length-1)
}
function Jee_Decode(Code){
    res=""
    Code=Code.slice(1,Code.length)
    Code.split("_").forEach(Co => {
        res+=String.fromCodePoint(Number(Co))
    });
    return res
}

async function hashPassword(password) {
    const data = new TextEncoder().encode(password);
    const hash = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(hash))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
}

function DrawStudentExams(student){
    let OUTPOT = "";
    let examsHTML = "";
    if(student.exams){
        for(const exam in student.exams){
            const total = student.exams[exam][0];
            const score = student.exams[exam][1];
            const percent = Math.round(score/total*100);
            examsHTML += `
                <div class="examCard">
                    <div class="examHeader">
                        <span>${exam}</span>
                        <span>${score} / ${total}</span>
                    </div>
                    <div class="progressBar">
                        <div class="progressFill"
                            style="width:${percent}%;">
                        </div>
                    </div>
                    <div class="examPercent">
                        ${percent}%
                    </div>
                </div>
            `;
        }
    }
    OUTPOT=examsHTML
    return OUTPOT
}
function DrawStudentVideos(student) {
    let OUTPUT = "";
    if (student.videos) {
        for (const video in student.videos) {
            const cps = Object.values(student.videos[video].cplist);
            const watched = cps.filter(v => v).length;
            const percent = cps.length
                ? Math.round((watched / cps.length) * 100)
                : 0;
            OUTPUT += `
                <div class="videoCard">
                    <div class="videoHeader">
                        <span class="videoName">🎥 ${Jee_Decode(video)}</span>
                    </div>
                    <div class="progressBar">
                        <div class="progressFill" style="width:${percent}%"></div>
                    </div>

                    <button class="Btn" onclick='Watch_Videos(${JSON.stringify(student.videos[video].meta)})'> اكمل المشاهده </button>

            `;
        }
    }

    return OUTPUT;
}

let youtubePlayer = null;
let youtubeReady = false;
let pendingVideoId = null;
function onYouTubeIframeAPIReady() {
    youtubePlayer = new YT.Player("player", {
        videoId: pendingVideoId || "",
        playerVars: {
            controls: 0,
            playsinline: 1,
            rel: 0
        },
        events: {
            onReady: function (event) {
                youtubeReady = true;
                const iframe = document.querySelector("#player iframe");
                if (iframe) {
                    iframe.setAttribute("allow", "fullscreen");
                    iframe.setAttribute("allowfullscreen", "");
                }
                if (pendingVideoId) {
                    youtubePlayer.loadVideoById(pendingVideoId);
                }
            }
        }
    });
}
const playPauseBtn = document.getElementById("play_and_pause");
const fullscreenBtn = document.getElementById("fullscreen");
const goBackBtn = document.getElementById("goback");
const controlButtons = [
    playPauseBtn,
    fullscreenBtn,
    goBackBtn
];
let controlsTimer = null;
playPauseBtn.onclick = () => {
    if (!youtubePlayer || !youtubeReady) return;
    const state = youtubePlayer.getPlayerState();
    if (state === YT.PlayerState.PLAYING) {
        youtubePlayer.pauseVideo();
    } else {
        youtubePlayer.playVideo();
    }
    showControls();
};
function showControls() {
    controlButtons.forEach(button => {
        button.classList.remove("controls-hidden");
    });
    clearTimeout(controlsTimer);
    controlsTimer = setTimeout(() => {
        controlButtons.forEach(button => {
            button.classList.add("controls-hidden");
        });
    }, 1000);
}
document.getElementById("overlay").addEventListener("click",() =>{
    showControls();
})
document.getElementById("fullscreen").onclick = async () => {
    const iframe = document.querySelector("#player iframe");
    if (!iframe) {
        console.warn("YouTube iframe غير موجود");
        return;
    }
    try {
        if (document.fullscreenElement) {
            await document.exitFullscreen();
        } else {
            await iframe.requestFullscreen();
        }
    } catch (error) {
        console.error("Fullscreen failed:", error);
    }
};
</script>
