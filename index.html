<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studentss PAGE</title>
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/mrosamavidiosystem-tech/AdminePAGE/refs/heads/main/STU_ICON.png">
    <style>
        :root{
            --bg:#f5f7fb;
            --card:#ffffff;
            --text:#222;
            --shadow:rgba(0,0,0,.15);
            --theme-color:#10b981;
            --primary:var(--theme-color);
            --primary-shadow:rgba(16,185,129,.35);
        }
        body.dark{
            --bg:#121212;
            --card:#1e1e1e;
            --text:#fff;
            --shadow:rgba(255,255,255,.08);
        }
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Tahoma,sans-serif;
        }
        body{
            background:var(--bg);
            color:var(--text);
            transition:.3s;
        }
        .header{
            display:flex;
            justify-content:center;
            gap:30px;
            padding:40px;
            flex-wrap:wrap;
            position:sticky;
            top:0;
            z-index:999;
            backdrop-filter:blur(10px);
            background:var(--bg);
            border-bottom:1px solid rgba(150,150,150,.2);
        }
        .card{
            width:250px;
            height:50px;
            background:var(--card);
            color:var(--text);
            display:flex;
            justify-content:center;
            align-items:center;
            border-radius:15px;
            font-size:28px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
            box-shadow:0 8px 20px var(--shadow);
        }
        .card:hover{
            background:var(--primary);
            color:white;
        }
        .bigcard{
            width:200px;
            height:250px;
            background:var(--card);
            color:var(--text);
            display:flex;
            justify-content:center;
            align-items:center;
            border-radius:15px;
            font-size:28px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
            box-shadow:0 8px 20px var(--shadow);
        }
        .bigcard:hover{
            background:var(--shadow);
            color:white;
        }
        .Students,
        .Exams,
        .Videos,
        .PAGE{
            width:95%;
            margin:35px auto;
            padding:25px;
            background:var(--card);
            border-radius:20px;
            box-shadow:0 8px 20px var(--shadow);
        }
        .Students,
        .Exams,
        .Videos{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
            gap:25px;
        }
        .bigcard{
            width:100%;
            min-height:220px;
            padding:20px;
            display:flex;
            flex-direction:column;
            justify-content:space-between;
            align-items:center;
        }
        .bigcard p{
            font-size:22px;
            font-weight:bold;
            text-align:center;
            margin-top:15px;
        }
        .bigcard button{
            width:100%;
            height:45px;
            border:none;
            border-radius:10px;
            background:var(--primary);
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
        }
        .bigcard button:hover{
            opacity:.9;
            transform:scale(1.04);
        }
        .Students>button,
        .Exams>button,
        .Videos>button{
            height:50px;
            border:none;
            border-radius:15px;
            font-size:22px;
            font-weight:bold;
            background:var(--primary);
            color:white;
            cursor:pointer;
            transition:.3s;
        }
        .Students>button:hover,
        .Exams>button:hover,
        .Videos>button:hover{
            transform:scale(1.04);
        }
        .PAGE{
            display:flex;
            justify-content:center;
            align-items:center;
        }
        #themeBtn{
            width:300px;
        }
        #PasswBtn{
            width:300px;
        }
        ::-webkit-scrollbar{
            width:10px;
        }
        ::-webkit-scrollbar-track{
            background:var(--bg);
        }
        ::-webkit-scrollbar-thumb{
            background:var(--primary);
            border-radius:20px;
        }
        @media(max-width:900px){
            .header{
                gap:15px;
                padding:20px;
            }
            .card{
                width:180px;
                font-size:20px;
            }
            .bigcard{
                min-height:200px;
            }
        }
        @media(max-width:600px){
            .header{
                flex-direction:column;
            }
            .card{
                width:100%;
            }
            #themeBtn{
                width:100%;
            }
            #PasswBtn{
                width:100%;
            }
        }
        .active{
            background:var(--primary) !important;
            color:white !important;
        }
        .Search_Par{
            grid-column:1/-1;
            display:flex;
            align-items:center;
            gap:15px;
            padding:18px;
            margin-bottom:15px;
            background:var(--bg);
            border-radius:15px;
            box-shadow:0 5px 15px var(--shadow);
            flex-wrap:wrap;
        }
        .searchInput{
            flex:1;
            min-width:250px;
            height:45px;
            border:none;
            outline:none;
            border-radius:10px;
            padding:0 15px;
            font-size:18px;
            background:var(--card);
            color:var(--text);
            box-shadow:0 2px 10px var(--shadow);
            transition:.3s;
        }
        .searchInput:focus{
            box-shadow:0 0 0 3px var(--primary);
        }
        .searchFilter{
            height:45px;
            min-width:120px;
            border:none;
            outline:none;
            border-radius:10px;
            background:var(--card);
            color:var(--text);
            padding:0 10px;
            cursor:pointer;
            box-shadow:0 2px 10px var(--shadow);
        }
        .refreshBtn{
            height:45px;
            padding:0 20px;
            border:none;
            border-radius:10px;
            background:var(--primary);
            color:white;
            font-size:17px;
            cursor:pointer;
            transition:.3s;
        }
        .refreshBtn:hover{
            transform:scale(1.05);
        }
        .counter{
            margin-right:auto;
            font-size:18px;
            font-weight:bold;
            color:var(--text);
        }
        .counter b{
            color:var(--primary);
        }
        @media(max-width:700px){
            .Search_Par{
                flex-direction:column;
                align-items:stretch;
            }
            .searchInput,
            .searchFilter,
            .refreshBtn{
                width:100%;
            }
            .counter{
                margin:0;
                text-align:center;
            }
        }
        .addBtn{
            grid-column:1 / -1;
            width:100%;
            height:65px;
            display:flex;
            justify-content:center;
            align-items:center;
            gap:12px;
            margin:10px 0 30px 0;
            padding:0 20px;
            border:none;
            border-radius:16px;
            background:linear-gradient(
                135deg,
                var(--primary),
                color-mix(in srgb, var(--primary) 70%, white)
            );
            color:#fff;
            font-size:24px;
            font-weight:bold;
            letter-spacing:.5px;
            cursor:pointer;
            transition:all .3s ease;
            box-shadow:0 10px 25px var(--primary-shadow);
        }
        .addBtn:hover{
            box-shadow:0 15px 35px var(--primary-shadow);
            filter:brightness(1.08);
        }
        .addBtn:active{
            transform:scale(.98);
        }
        body.dark .addBtn{
            background:var(--primary);
            box-shadow:0 10px 25px var(--primary-shadow);
        }
        body.dark .addBtn:hover{
            box-shadow:0 15px 35px var(--primary-shadow);
        }
        .addBtn::before{
            content:"➕";
            font-size:28px;
        }
        @media (max-width:768px){
            .addBtn{
                height:58px;
                font-size:20px;
            }
            .addBtn::before{
                font-size:24px;
            }
        }
        .themePicker{
            display:flex;
            gap:15px;
            margin-top:20px;
            flex-wrap:wrap;
        }
        .themeColor{
            width:50px;
            height:50px;
            border-radius:50%;
            cursor:pointer;
            transition:.3s;
            border:4px solid transparent;
        }
        .themeColor:hover{
            transform:scale(1.15);
        }
        .themeColor.active{
            border-color:white;
            box-shadow:0 0 0 3px var(--text);
        }
        .settingsBox{
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:30px;
        }
        .addstudent{
            width:500px;
            max-width:95%;
            margin:40px auto;
            padding:30px;
            background:var(--card);
            border-radius:20px;
            box-shadow:0 10px 30px var(--shadow);
            display:flex;
            flex-direction:column;
            gap:18px;
        }
        .hide{
            display: none;
        }
        .addstudent h2{
            text-align:center;
            color:var(--primary);
        }
        .addstudent input,
        .addstudent select{
            width:100%;
            height:50px;
            border:none;
            outline:none;
            border-radius:12px;
            padding:0 15px;
            background:var(--bg);
            color:var(--text);
            font-size:18px;
            box-shadow:0 3px 10px var(--shadow);
        }
        .addstudent input:focus,
        .addstudent select:focus{
            outline:2px solid var(--primary);
        }
        .saveBtn{
            height:55px;
            border:none;
            border-radius:12px;
            background:var(--primary);
            color:white;
            font-size:20px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }
        .saveBtn:hover{
            filter:brightness(1.08);
        }
        .studentProfile{
            width:90%;
            max-width:900px;
            margin:30px auto;
            padding:25px;
            background:var(--card);
            color:var(--text);
            border-radius:20px;
            box-shadow:0 10px 25px var(--shadow);
        }
        .studentPro h2{
            text-align:center;
            color:var(--primary);
            margin-bottom:25px;
        }
        .studentInfo{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:15px;
            margin-bottom:25px;
        }
        .studentInfo div{
            background:var(--bg);
            padding:15px;
            border-radius:12px;
            box-shadow:0 3px 8px var(--shadow);
        }
        .examCard{
            background:var(--bg);
            border-radius:15px;
            padding:18px;
            margin:18px 0;
            box-shadow:0 4px 12px var(--shadow);
        }
        .examHeader{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:10px;
            font-weight:bold;
        }
        .progressBar{
            width:100%;
            height:16px;
            background:#d6d6d6;
            border-radius:20px;
            overflow:hidden;
        }
        .progressFill{
            height:100%;
            border-radius:20px;
            background:var(--primary);
            transition:.4s;
        }
        .examPercent{
            text-align:right;
            margin-top:8px;
            font-weight:bold;
            color:var(--primary);
        }
        .videoCard{
            background:var(--bg);
            border-radius:15px;
            padding:18px;
            margin:18px 0;
            box-shadow:0 4px 12px var(--shadow);
        }
        .videoHeader{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:15px;
            font-weight:bold;
        }
        .videoHeader span:last-child{
            background:var(--primary);
            color:white;
            padding:4px 12px;
            border-radius:30px;
            font-size:14px;
        }
        .videoCard{
            background:var(--bg);
            border-radius:15px;
            padding:20px;
            margin:20px 0;
            box-shadow:0 4px 12px var(--shadow);
        }
        .videoHeader{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
            font-size:18px;
            font-weight:bold;
        }
        .videoHeader span:last-child{
            background:var(--primary);
            color:#fff;
            padding:6px 14px;
            border-radius:30px;
            font-size:15px;
        }
        .cpContainer{
            display:flex;
            justify-content:flex-end;
            align-items:center;
            flex-wrap:wrap;
            gap:0;
            direction:ltr;
        }
        .cpItem{
            display:flex;
            align-items:center;
        }
        .cpCircle{
            width:22px;
            height:22px;
            border-radius:50%;
            background:#dc3545;
            transition:.3s;
        }
        .studentButtons button img{
            width:22px;
            height:22px;
            vertical-align:middle;
            margin-left:6px;
        }
        .cpCircle.done{
            background:#34c759;
        }
        .cpLine{
            width:35px;
            height:4px;
            background:#dc3545;
        }
        .cpLine.done{
            background:#34c759;
        }
        .cpItem:last-child .cpLine{
            display:none;
        }
        .studentButtons{
            display:flex;
            justify-content:center;
            flex-wrap:wrap;
            gap:15px;
            margin-top:30px;
        }
        .studentButtons button{
            border:none;
            border-radius:12px;
            padding:12px 20px;
            color:white;
            cursor:pointer;
            font-size:16px;
            font-weight:bold;
            transition:.3s;
        }
        .waBtn{
            background:#25D366;
        }
        .msgBtn{
            background:#0d6efd;
        }
        .editBtn{
            background:#ff9800;
        }
        .deleteBtn{
            background:#dc3545;
        }
        .backBtn{
            background:#6c757d;
        }
        @media(max-width:700px){
            .studentInfo{
                grid-template-columns:1fr;
            }
            .videoHeader,
            .examHeader{
                flex-direction:column;
                gap:8px;
                align-items:flex-start;
            }
            .studentButtons button{
                width:100%;
            }
        }
        #loadingScreen{
            position:fixed;
            inset:0;
            background:var(--bg);
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            gap:25px;
            z-index:999999;
            transition:.5s;
        }
        #loadingScreen.hide{
            opacity:0;
        }
        #UpdateScreen{
            position:fixed;
            inset:0;
            background:var(--bg);
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            gap:25px;
            z-index:99999999;
            transition:.5s;
        }
        .loader{
            width:90px;
            height:90px;
            border:8px solid rgba(150,150,150,.2);
            border-top:8px solid var(--primary);
            border-radius:50%;
            animation:spin .8s linear infinite;
        }
        #UpdateScreen h2{
            color:var(--text);
            font-size:24px;
            font-weight:bold;
        }
        #loadingScreen h2{
            color:var(--text);
            font-size:24px;
            font-weight:bold;
        }
        @keyframes spin{
            from{
                transform:rotate(0deg);
            }
            to{
                transform:rotate(360deg);
            }
        }
        .editstudent{
            width:500px;
            max-width:95%;
            margin:40px auto;
            padding:30px;
            background:var(--card);
            border-radius:20px;
            box-shadow:0 10px 30px var(--shadow);
            display:flex;
            flex-direction:column;
            gap:18px;
        }
        .editstudent h2{
            text-align:center;
            color:var(--primary);
        }
        .editstudent input,
        .editstudent select{
            width:100%;
            height:50px;
            border:none;
            outline:none;
            border-radius:12px;
            padding:0 15px;
            background:var(--bg);
            color:var(--text);
            font-size:18px;
            box-shadow:0 3px 10px var(--shadow);
        }
        .editstudent input:focus,
        .editstudent select:focus{
            outline:2px solid var(--primary);
        }.addvideo{
            width:95%;
            max-width:1500px;
            margin:40px auto;
            padding:30px;
            background:var(--card);
            border-radius:20px;
            box-shadow:0 10px 30px var(--shadow);
            display:flex;
            flex-direction:column;
            gap:18px;
        }
        .addvideo h2{
            text-align:center;
            color:var(--primary);
        }
        .addvideo input,
        .addvideo select{
            width:100%;
            height:50px;
            border:none;
            outline:none;
            border-radius:12px;
            padding:0 15px;
            background:var(--bg);
            color:var(--text);
            font-size:18px;
            box-shadow:0 3px 10px var(--shadow);
        }
        .addvideo input:focus,
        .addvideo select:focus{
            outline:2px solid var(--primary);
        }.videoForm{
            display:grid;
            grid-template-columns:1fr 1.2fr;
            gap:30px;
            align-items:start;
        }
        .videoInputs{
            display:flex;
            flex-direction:column;
            gap:18px;
        }
        .videoPreview{
            background:var(--bg);
            border-radius:18px;
            padding:15px;
            box-shadow:0 5px 20px var(--shadow);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:650px;
        }
        .videoPreview iframe{
            width:100%;
            height:620px;
            border:none;
            border-radius:15px;
        }
        #Video_Thumbnail{
            width:100%;
            max-width:350px;
            border-radius:15px;
            display:none;
            box-shadow:0 5px 20px var(--shadow);
        }
        .duration-inputs{
            display:flex;
            align-items:center;
            gap:10px;
        }
        .duration-inputs input{
            flex:1;
            text-align:center;
        }
        .duration-inputs span{
            font-size:25px;
            font-weight:bold;
        }
        @media(max-width:1100px){
            .videoForm{
                grid-template-columns:1fr;
            }
            .videoPreview{
                min-height:400px;
            }
            .videoPreview iframe{
                height:400px;
            }
        }
        #YoutubeVideos{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
            gap:20px;
        }
        .YoutubeCard{
            background:var(--shadow);
            border-radius:15px;
            overflow:hidden;
        }
        .YoutubeCard img{
            width:100%;
            display:block;
        }
        .YoutubeCard h3{
            padding:15px;
            font-size:17px;
            height:70px;
            overflow:hidden;
        }
        .YoutubeCard button{
            width:90%;
            margin:10px auto 20px;
            display:block;
        }
        .YoutubeCard button{
            width:90%;
            height:48px;
            margin:15px auto 20px;
            display:flex;
            justify-content:center;
            align-items:center;
            gap:8px;
            border:none;
            border-radius:12px;
            background:var(--primary);
            color:#fff;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            transition:.25s;
            box-shadow:0 6px 15px var(--primary-shadow);
        }
        .YoutubeCard button::before{
            content:"🎥";
        }
        .YoutubeCard button:hover{
            filter:brightness(1.08);
        }
        .YoutubeCard button:active{
            transform:scale(.97);
        }
        body.dark .YoutubeCard button{
            box-shadow:0 6px 15px rgba(0,0,0,.45);
        }
        .YoutubeCard img{
            width:100%;
            aspect-ratio:16/9;
            object-fit:cover;
            display:block;
        }

            width:95%;
            max-width:1400px;

            padding:30px;
            background:var(--card);
            color:var(--text);
            border-radius:20px;
            box-shadow:0 10px 30px var(--shadow);
        }
        .videoProfile h2{
            text-align:center;
            color:var(--primary);
            margin-bottom:30px;
        }
        .videoBanner{
            width:100%;
            display:flex;
            justify-content:center;
            margin-bottom:30px;
        }
        .videoBanner iframe{
            width:100%;

            border:none;
            border-radius:20px;
            background:#000;
            box-shadow:0 10px 25px var(--shadow);
        }

            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(260px,1fr));

            margin-bottom:30px;
        }
        .videoInfo div{
            background:var(--bg);

        .videoInfo b{

        .videoInfo p{

        }
        .videoInfo a{

            word-break:break-all;
        }
        .videoInfo a:hover{

        }

        }
        .cpPreview h3{
            text-align:center;

        }
        .cpPreview .cpContainer{
            justify-content:center;
            flex-wrap:wrap;
        }
        .studentButtons{
            display:flex;
            justify-content:center;
            flex-wrap:wrap;
            gap:15px;
        }
        .studentButtons button{
            min-width:180px;
        }
        @media(max-width:900px){
            .videoBanner iframe{
                height:420px;
            }
        }
        @media(max-width:700px){
            .videoInfo{
                grid-template-columns:1fr;
            }
            .videoBanner iframe{
                height:250px;
            }
            .studentButtons button{
                width:100%;
            }
        }
        .editvideo{
            width:700px;
            max-width:95%;
            margin:40px auto;
            padding:30px;
            background:var(--card);
            border-radius:20px;
            box-shadow:0 10px 30px var(--shadow);
            display:flex;
            flex-direction:column;
            gap:18px;
            animation:fadeUp .35s ease;
        }
        .editvideo h2{
            text-align:center;
            color:var(--primary);
            font-size:30px;
            margin-bottom:10px;
        }
        .editvideo input,
        .editvideo select{
            width:100%;
            height:55px;
            border:none;
            outline:none;
            border-radius:12px;
            padding:0 18px;
            background:var(--bg);

    for (const car of text){

    }
    console.log()
    return res.slice(0,res.length-1)
}
function Jee_Decode(Code){
    res=""
    Code=Code.slice(1,Code.length)
    Code.split("_").forEach(Co => {
        res+=String.fromCodePoint(Number(Co))
    });
    return res
}

async function hashPassword(password) {
    const data = new TextEncoder().encode(password);
    const hash = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(hash))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
}
